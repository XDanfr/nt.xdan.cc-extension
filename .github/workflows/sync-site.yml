name: Sync site

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update site submodule
        id: update
        run: |
          git submodule update --remote site
          if git diff --quiet site; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump patch version
        if: steps.update.outputs.changed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const p = "src/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const v = m.version.split(".").map(Number);
            v[2] += 1;
            m.version = v.join(".");
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
      - name: Verify the package builds
        if: steps.update.outputs.changed == 'true'
        run: npm run package
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site src/manifest.json
          git commit -m "Update site to $(git -C site rev-parse --short HEAD)"
          git push
